name: live CLV refresh

# The expensive half. Re-ingests the season, rebuilds the warehouse including
# games that have not kicked off yet, refits the models and publishes Atlas's
# number for every scheduled game to tracking/numbers.csv.
#
# Weekly, because the inputs are weekly: a team's efficiency does not change
# between Tuesday and Thursday.
#
# Scheduled workflows only run on the repository's default branch, so this is
# dormant until the branch is merged. Until then, `make live-refresh` does the
# same work by hand.

on:
  schedule:
    - cron: "40 9 * 8-12,1 2"
  workflow_dispatch:

concurrency:
  group: live-clv
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ingest
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m atlas.ingest

      - name: Rebuild and publish Atlas's numbers
        run: python -m atlas.live refresh

      - name: Commit the numbers
        run: |
          git config user.name "atlas-tracker"
          git config user.email "noreply@anthropic.com"
          git add tracking/numbers.csv
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "live: refresh numbers $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
