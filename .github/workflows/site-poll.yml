name: site poll

# The market, and nothing else - except that the first tick at or after 04:00
# ET each day is the heavy refresh (warehouse, model, every page, social),
# because this schedule fires reliably and site-heavy.yml's own did not: it
# landed hours late, once a day, and was cancelled while it waited behind a
# poll. publish.yml's gate decides which this tick is (schedule.gate). Hourly
# most of the time, every fifteen minutes inside the game-day windows in
# atlas/ops/schedule.py.
#
# These crons are a deliberate superset. Cron is UTC, the product's schedule is
# Eastern, and the two drift by an hour twice a season - so rather than encode
# a UTC approximation that silently goes wrong in November, fire often and let
# should_poll() decide in Eastern time. A run that is not a poll minute stops
# at the gate in a few seconds, before installing anything.
#
# Every fifteen minutes, every day, and off the hour. GitHub drops scheduled
# runs under load and the top of the hour is when it is most loaded: on 23-25
# September 2026 an hourly "0 * * * *" delivered about five runs a day, hours
# apart, against a health check that calls a poll stale after two hours. Four
# chances an hour means a dropped tick costs fifteen minutes, not the hour, and
# schedule.due() still decides the cadence - hourly, or every fifteen minutes
# inside a game-day window - so the extra ticks cost seconds, not provider
# requests.

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: poll even when it is not a poll minute
        type: boolean
        default: true

# A called workflow can only narrow what its caller was granted, never widen
# it. With no block here the caller gets the repository default - read-only on
# a repo configured that way - and publish.yml asking for pages: write reads as
# an escalation, which GitHub rejects before any job starts. So the grant lives
# with the trigger, which is also where it is easiest to audit.
permissions:
  contents: write      # commit tracking/ and the freshness stamp
  pages: write         # deploy
  id-token: write      # the OIDC token deploy-pages signs with

# Pages allows one deployment at a time, and a heavy run and a poll must never
# interleave on the tracking store - the second's commit cannot rebase onto
# the first's. Both callers share this group, so one waits for the other.
# Never cancel in progress: a half-finished poll that has captured the market
# but not recorded it is the one state worth avoiding.
concurrency:
  group: atlas-publish
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      mode: poll
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    secrets:
      # The day's Polymarket positions are logged at a fixed poll and the owner
      # page is sealed by every poll (atlas/polymarket/__main__.py); only
      # ciphertext leaves the runner.
      ATLAS_OWNER_KEY: ${{ secrets.ATLAS_OWNER_KEY }}
      # For the tick that is the day's heavy refresh: the ingest's CFBD key and
      # the reader counter the owner page reads. The gate withholds the counter
      # token from an ordinary poll.
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ATLAS_COUNTER_TOKEN: ${{ secrets.ATLAS_COUNTER_TOKEN }}
      # The venue's key, for order previews of the day's positions as they are
      # logged (atlas/polymarket/account.py): previews only, never an order.
      POLYMARKET_US_KEY_ID: ${{ secrets.POLYMARKET_US_KEY_ID }}
      POLYMARKET_US_SECRET: ${{ secrets.POLYMARKET_US_SECRET }}
      # The live step (atlas/polymarket/orders.py), armed off: the mode (unset, dry
      # or live), the arming phrase, and the bankroll the stakes are sized against.
      POLYMARKET_US_LIVE: ${{ secrets.POLYMARKET_US_LIVE }}
      POLYMARKET_US_ARMED: ${{ secrets.POLYMARKET_US_ARMED }}
      ATLAS_LIVE_BANKROLL: ${{ secrets.ATLAS_LIVE_BANKROLL }}
