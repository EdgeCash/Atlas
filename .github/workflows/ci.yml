name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check atlas tests

      - name: Test
        # The suite builds a complete warehouse from a synthetic league and
        # runs the full research pipeline over it. ATLAS_OFFLINE makes any
        # accidental network call fail loudly instead of downloading a
        # gigabyte of real data in CI.
        env:
          ATLAS_OFFLINE: "1"
        run: python -m pytest -q

  reproducibility:
    name: warehouse rebuild is byte-stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build twice from the same synthetic sources and compare
        env:
          ATLAS_OFFLINE: "1"
        run: python scripts/check_reproducible.py
