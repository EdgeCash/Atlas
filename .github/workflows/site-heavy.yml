name: site heavy

# The heavy refresh from the Actions tab: warehouse, model, market, every
# page, social assets. Forced by default, so it runs when asked.
#
# It has no schedule of its own any more. It had one - "12 8,9,10,11 * * *",
# several candidate hours for publish.yml's Eastern-time gate to pick the
# first at or after 04:00 ET from - and GitHub fired it once a day, hours
# late, into a queue where the next poll cancelled it: no scheduled heavy
# refresh succeeded between 3 and 23 October 2026, and the site lived on runs
# started by hand. The poll's schedule (site-poll.yml) fires four times an
# hour and has never missed by more than minutes, so the first poll tick at or
# after 04:00 ET is now the day's heavy refresh (schedule.gate).

on:
  workflow_dispatch:
    inputs:
      force:
        description: run even outside the 04:00 ET window
        type: boolean
        default: true

# A called workflow can only narrow what its caller was granted, never widen
# it. With no block here the caller gets the repository default - read-only on
# a repo configured that way - and publish.yml asking for pages: write reads as
# an escalation, which GitHub rejects before any job starts. So the grant lives
# with the trigger, which is also where it is easiest to audit.
permissions:
  contents: write      # commit tracking/ and the freshness stamp
  pages: write         # deploy
  id-token: write      # the OIDC token deploy-pages signs with

# Pages allows one deployment at a time, and a heavy run and a poll must never
# interleave on the tracking store - the second's commit cannot rebase onto
# the first's. Both callers share this group, so one waits for the other.
# Never cancel in progress: a half-finished poll that has captured the market
# but not recorded it is the one state worth avoiding.
concurrency:
  group: atlas-publish
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      mode: heavy
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    secrets:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ATLAS_OWNER_KEY: ${{ secrets.ATLAS_OWNER_KEY }}
      ATLAS_COUNTER_TOKEN: ${{ secrets.ATLAS_COUNTER_TOKEN }}
