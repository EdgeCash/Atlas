name: site heavy

# 04:00 ET daily: warehouse, model, market, every page, social assets.
#
# Cron here is UTC and has no notion of daylight saving, so several candidate
# hours fire and publish.yml's Eastern-time gate lets exactly one through: the
# first that is at or after 04:00 ET on a day with no heavy run yet. 08:12 UTC
# is 04:12 EDT (Mar-Nov); 09:12 UTC is 04:12 EST (Nov-Mar).
#
# 10 and 11 UTC are backups. GitHub drops and delays scheduled runs under
# load - the 04:00 run landed after 09:00 ET on 24 and 25 September 2026 - and
# a backup that finds the day's heavy run done stops at the gate in seconds.
#
# Minute 12, off the hour where GitHub is busiest, and midway between the
# poll's ticks (4, 19, 34, 49): the two share a concurrency group, and a heavy
# run left pending behind a poll is cancelled if another poll queues behind it.

on:
  schedule:
    - cron: "12 8,9,10,11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: run even outside the 04:00 ET window
        type: boolean
        default: true

# A called workflow can only narrow what its caller was granted, never widen
# it. With no block here the caller gets the repository default - read-only on
# a repo configured that way - and publish.yml asking for pages: write reads as
# an escalation, which GitHub rejects before any job starts. So the grant lives
# with the trigger, which is also where it is easiest to audit.
permissions:
  contents: write      # commit tracking/ and the freshness stamp
  pages: write         # deploy
  id-token: write      # the OIDC token deploy-pages signs with

# Pages allows one deployment at a time, and a heavy run and a poll must never
# interleave on the tracking store - the second's commit cannot rebase onto
# the first's. Both callers share this group, so one waits for the other.
# Never cancel in progress: a half-finished poll that has captured the market
# but not recorded it is the one state worth avoiding.
concurrency:
  group: atlas-publish
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      mode: heavy
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    secrets:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ATLAS_OWNER_KEY: ${{ secrets.ATLAS_OWNER_KEY }}
      ATLAS_COUNTER_TOKEN: ${{ secrets.ATLAS_COUNTER_TOKEN }}
      BP_API_KEY: ${{ secrets.BP_API_KEY }}
      BP_USER_ID: ${{ secrets.BP_USER_ID }}
      BP_USER_KEY: ${{ secrets.BP_USER_KEY }}
